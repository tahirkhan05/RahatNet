<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="uca" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9C9A92"/>
    </marker>
    <marker id="ucs" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5B9BD5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#F7F6F3" rx="16"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1D1A">RahatNet — Use-Case Diagram</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#69675F">Three actors, one platform, every interaction mapped</text>

  <!-- ===== SYSTEM BOUNDARY ===== -->
  <rect x="200" y="68" width="580" height="580" rx="14" fill="none" stroke="#1A3A6B" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="490" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#1A3A6B">«system» RahatNet Platform</text>

  <!-- ===== USE CASE OVALS ===== -->

  <!-- Citizen use cases (left-center column) -->
  <!-- UC1 -->
  <ellipse cx="360" cy="160" rx="100" ry="22" fill="#FAEEDA" stroke="#D4A06A" stroke-width="1.5"/>
  <text x="360" y="164" text-anchor="middle" font-size="11" fill="#412402">Submit Need Report</text>

  <!-- UC2 -->
  <ellipse cx="360" cy="220" rx="100" ry="22" fill="#FAEEDA" stroke="#D4A06A" stroke-width="1.5"/>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#412402">Track Report Status</text>

  <!-- UC3 -->
  <ellipse cx="360" cy="280" rx="100" ry="22" fill="#FAEEDA" stroke="#D4A06A" stroke-width="1.5"/>
  <text x="360" y="284" text-anchor="middle" font-size="11" fill="#412402">Receive Notifications</text>

  <!-- UC4 — extends submit -->
  <ellipse cx="530" cy="140" rx="100" ry="22" fill="#FFF5F5" stroke="#F5C0C0" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="530" y="136" text-anchor="middle" font-size="10" fill="#7B1C1C">«extend»</text>
  <text x="530" y="149" text-anchor="middle" font-size="10" fill="#7B1C1C">Voice / Photo Input</text>
  <line x1="430" y1="152" x2="430" y2="140" stroke="#9C9A92" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#uca)"/>

  <!-- UC5 — includes offline -->
  <ellipse cx="530" cy="200" rx="100" ry="22" fill="#FFF5F5" stroke="#F5C0C0" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="530" y="196" text-anchor="middle" font-size="10" fill="#7B1C1C">«include»</text>
  <text x="530" y="209" text-anchor="middle" font-size="10" fill="#7B1C1C">Offline Queue (2G)</text>
  <line x1="460" y1="160" x2="460" y2="200" stroke="#9C9A92" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#uca)"/>

  <!-- Coordinator use cases (right column) -->
  <ellipse cx="660" cy="160" rx="110" ry="22" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="1.5"/>
  <text x="660" y="164" text-anchor="middle" font-size="11" fill="#173404">View Live Heatmap</text>

  <ellipse cx="660" cy="220" rx="110" ry="22" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="1.5"/>
  <text x="660" y="224" text-anchor="middle" font-size="11" fill="#173404">Review Priority Queue</text>

  <ellipse cx="660" cy="280" rx="110" ry="22" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="1.5"/>
  <text x="660" y="284" text-anchor="middle" font-size="11" fill="#173404">Assign Volunteer</text>

  <ellipse cx="660" cy="340" rx="110" ry="22" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="1.5"/>
  <text x="660" y="344" text-anchor="middle" font-size="11" fill="#173404">Track Resources</text>

  <ellipse cx="660" cy="400" rx="110" ry="22" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="1.5"/>
  <text x="660" y="404" text-anchor="middle" font-size="11" fill="#173404">Export Relief Report</text>

  <!-- Volunteer use cases (center column, lower) -->
  <ellipse cx="430" cy="380" rx="110" ry="22" fill="#EEEDFE" stroke="#9B8FE8" stroke-width="1.5"/>
  <text x="430" y="384" text-anchor="middle" font-size="11" fill="#26215C">Register Skills</text>

  <ellipse cx="430" cy="440" rx="110" ry="22" fill="#EEEDFE" stroke="#9B8FE8" stroke-width="1.5"/>
  <text x="430" y="444" text-anchor="middle" font-size="11" fill="#26215C">Accept / Decline Task</text>

  <ellipse cx="430" cy="500" rx="110" ry="22" fill="#EEEDFE" stroke="#9B8FE8" stroke-width="1.5"/>
  <text x="430" y="504" text-anchor="middle" font-size="11" fill="#26215C">Navigate to Location</text>

  <ellipse cx="430" cy="560" rx="110" ry="22" fill="#EEEDFE" stroke="#9B8FE8" stroke-width="1.5"/>
  <text x="430" y="564" text-anchor="middle" font-size="11" fill="#26215C">Mark Task Complete</text>

  <!-- ===== ACTORS ===== -->

  <!-- Citizen actor -->
  <circle cx="100" cy="200" r="18" fill="#FAEEDA" stroke="#D4A06A" stroke-width="2"/>
  <line x1="100" y1="218" x2="100" y2="260" stroke="#854F0B" stroke-width="2"/>
  <line x1="100" y1="232" x2="74" y2="248" stroke="#854F0B" stroke-width="2"/>
  <line x1="100" y1="232" x2="126" y2="248" stroke="#854F0B" stroke-width="2"/>
  <line x1="100" y1="260" x2="80" y2="285" stroke="#854F0B" stroke-width="2"/>
  <line x1="100" y1="260" x2="120" y2="285" stroke="#854F0B" stroke-width="2"/>
  <text x="100" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#854F0B">Citizen</text>

  <!-- Citizen connections -->
  <line x1="136" y1="198" x2="258" y2="162" stroke="#D4A06A" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="136" y1="208" x2="258" y2="222" stroke="#D4A06A" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="136" y1="218" x2="258" y2="279" stroke="#D4A06A" stroke-width="1.2" marker-end="url(#uca)"/>

  <!-- Coordinator actor -->
  <circle cx="870" cy="280" r="18" fill="#EAF3DE" stroke="#7BBD4F" stroke-width="2"/>
  <line x1="870" y1="298" x2="870" y2="340" stroke="#27500A" stroke-width="2"/>
  <line x1="870" y1="312" x2="844" y2="328" stroke="#27500A" stroke-width="2"/>
  <line x1="870" y1="312" x2="896" y2="328" stroke="#27500A" stroke-width="2"/>
  <line x1="870" y1="340" x2="850" y2="365" stroke="#27500A" stroke-width="2"/>
  <line x1="870" y1="340" x2="890" y2="365" stroke="#27500A" stroke-width="2"/>
  <text x="870" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#27500A">Coordinator</text>

  <!-- Coordinator connections -->
  <line x1="836" y1="270" x2="772" y2="162" stroke="#7BBD4F" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="836" y1="276" x2="772" y2="222" stroke="#7BBD4F" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="836" y1="280" x2="772" y2="280" stroke="#7BBD4F" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="836" y1="286" x2="772" y2="340" stroke="#7BBD4F" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="836" y1="294" x2="772" y2="400" stroke="#7BBD4F" stroke-width="1.2" marker-end="url(#uca)"/>

  <!-- Volunteer actor -->
  <circle cx="100" cy="480" r="18" fill="#EEEDFE" stroke="#9B8FE8" stroke-width="2"/>
  <line x1="100" y1="498" x2="100" y2="540" stroke="#3C3489" stroke-width="2"/>
  <line x1="100" y1="512" x2="74" y2="528" stroke="#3C3489" stroke-width="2"/>
  <line x1="100" y1="512" x2="126" y2="528" stroke="#3C3489" stroke-width="2"/>
  <line x1="100" y1="540" x2="80" y2="565" stroke="#3C3489" stroke-width="2"/>
  <line x1="100" y1="540" x2="120" y2="565" stroke="#3C3489" stroke-width="2"/>
  <text x="100" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Volunteer</text>

  <!-- Volunteer connections -->
  <line x1="136" y1="476" x2="318" y2="382" stroke="#9B8FE8" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="136" y1="482" x2="318" y2="442" stroke="#9B8FE8" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="136" y1="488" x2="318" y2="502" stroke="#9B8FE8" stroke-width="1.2" marker-end="url(#uca)"/>
  <line x1="136" y1="494" x2="318" y2="562" stroke="#9B8FE8" stroke-width="1.2" marker-end="url(#uca)"/>

  <!-- ===== SYSTEM ACTOR BOXES ===== -->
  <!-- Gemini AI -->
  <rect x="210" y="620" width="120" height="36" rx="8" fill="#EBF5FF" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="270" y="635" text-anchor="middle" font-size="10" font-weight="600" fill="#0C447C">«system»</text>
  <text x="270" y="649" text-anchor="middle" font-size="10" fill="#0C447C">Gemini AI</text>

  <!-- Google Maps -->
  <rect x="360" y="620" width="120" height="36" rx="8" fill="#EBF5FF" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="420" y="635" text-anchor="middle" font-size="10" font-weight="600" fill="#0C447C">«system»</text>
  <text x="420" y="649" text-anchor="middle" font-size="10" fill="#0C447C">Google Maps</text>

  <!-- Firebase FCM -->
  <rect x="510" y="620" width="120" height="36" rx="8" fill="#EBF5FF" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="570" y="635" text-anchor="middle" font-size="10" font-weight="600" fill="#0C447C">«system»</text>
  <text x="570" y="649" text-anchor="middle" font-size="10" fill="#0C447C">Firebase FCM</text>

  <!-- IMD API -->
  <rect x="660" y="620" width="120" height="36" rx="8" fill="#EBF5FF" stroke="#5B9BD5" stroke-width="1.5"/>
  <text x="720" y="635" text-anchor="middle" font-size="10" font-weight="600" fill="#0C447C">«system»</text>
  <text x="720" y="649" text-anchor="middle" font-size="10" fill="#0C447C">IMD API</text>

  <!-- system connections (dotted) -->
  <line x1="270" y1="620" x2="360" y2="502" stroke="#5B9BD5" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ucs)"/>
  <line x1="420" y1="620" x2="430" y2="522" stroke="#5B9BD5" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ucs)"/>
  <line x1="570" y1="620" x2="430" y2="462" stroke="#5B9BD5" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ucs)"/>
  <line x1="720" y1="620" x2="660" y2="162" stroke="#5B9BD5" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ucs)"/>
</svg>
