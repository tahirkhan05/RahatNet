# ─────────────────────────────────────────────────────────────────────────────
# RahatNet CI — runs on every pull request targeting main or develop
#
# Job dependency graph:
#
#   validate ──┬── test   (unit + integration, coverage gate ≥ 80%)
#              └── build  ──── e2e  (Playwright against the built app)
#
# All jobs must pass before a PR can be merged (required status checks).
#
# Turbo remote cache (Vercel):
#   TURBO_TOKEN and TURBO_TEAM are stored as repository secrets.
#   On a cache hit, lint/typecheck/build are skipped entirely — PRs that
#   touch only documentation or test files finish in < 60 seconds.
#
# Docker-based build:
#   The `build` job runs inside the project's Dockerfile so the CI
#   environment is identical to production.  We use the docker/build-push-action
#   but do NOT push the image on PRs — we just verify it builds.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened

# Cancel in-flight runs for the same PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment
# ─────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.1.0'
  # Turbo remote cache — injected from repository secrets
  TURBO_TOKEN:  ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM:   ${{ secrets.TURBO_TEAM }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Validate (lint + typecheck)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for turbo to detect changed packages
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck (Turbo parallel)
        run: pnpm turbo run lint typecheck --parallel
        env:
          # These env vars must exist for tsc to pass (Next.js reads them at compile time)
          NEXT_PUBLIC_FIREBASE_API_KEY:            ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:        ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:         ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:     ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID:             ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL:       ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY:             ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_APP_URL:                     'http://localhost:3000'
          NEXT_PUBLIC_ENV:                         'ci'

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Unit & Integration Tests
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        # turbo run test passes -- --coverage down to vitest
        run: pnpm turbo run test -- --coverage --reporter=verbose
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY:            ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:        ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:         ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:     ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID:             ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL:       ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY:             ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_APP_URL:                     'http://localhost:3000'
          NEXT_PUBLIC_ENV:                         'ci'
          CI:                                      'true'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token:     ${{ secrets.CODECOV_TOKEN }}
          directory: apps/web/coverage
          flags:     unit
          fail_ci_if_error: false   # coverage upload failure doesn't block PR

      - name: Enforce ≥ 80% coverage
        # Vitest exits 1 when thresholds fail (set in vitest.config.ts).
        # This step is intentionally separate so the coverage file is uploaded
        # before we fail the job.
        run: |
          if [ -f apps/web/coverage/coverage-summary.json ]; then
            LINES=$(cat apps/web/coverage/coverage-summary.json | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total']['lines']['pct'])")
            echo "Line coverage: ${LINES}%"
            python3 -c "import sys; sys.exit(0 if float('${LINES}') >= 80 else 1)" || \
              { echo "❌ Coverage ${LINES}% is below the 80% threshold"; exit 1; }
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Build (Docker-based)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image (don't push on PRs — just verify it compiles).
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          # Cache layers from the GitHub Container Registry to speed up builds.
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_DATABASE_URL=${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
            NEXT_PUBLIC_APP_URL=https://rahatnet.web.app
            NEXT_PUBLIC_ENV=ci
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          tags: rahatnet/web:ci-${{ github.sha }}
          outputs: type=local,dest=/tmp/build-output

      # Also run the standard pnpm build so Turbo can cache it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo build (with remote cache)
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY:            ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:        ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:         ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:     ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID:             ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL:       ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY:             ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_APP_URL:                     'https://rahatnet.web.app'
          NEXT_PUBLIC_ENV:                         'ci'
          NEXT_PUBLIC_COMMIT_SHA:                  ${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: apps/web/.next
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: E2E Tests (Playwright)
# ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rahatnet/web exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: apps/web/.next

      - name: Start Next.js server (background)
        run: |
          cd apps/web
          pnpm start &
          # Wait for the server to be ready
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          PORT: 3000
          NEXT_PUBLIC_FIREBASE_API_KEY:            ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:        ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:         ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:     ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID:             ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL:       ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY:             ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_APP_URL:                     'http://localhost:3000'
          NEXT_PUBLIC_ENV:                         'ci'

      - name: Run Playwright E2E tests
        run: pnpm --filter @rahatnet/web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI:                  'true'

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
